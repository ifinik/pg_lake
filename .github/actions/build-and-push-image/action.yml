name: Reuse upstream CI image
description: Use the published upstream image for this Dockerfile without pushing images
inputs:
  github_token:
    description: Unused; retained for compatibility with the upstream workflow
    required: false
  org_name:
    description: Organization publishing the upstream image
    required: true
  base_image_name:
    description: Base image name
    required: true
  base_image_tag:
    description: Unused; the Dockerfile hash selects the published image
    required: false
  final_image_name:
    description: Published CI image name
    required: true

outputs:
  tag:
    description: Tag of the verified upstream image
    value: ${{ steps.reuse-image.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Verify published upstream image
      id: reuse-image
      shell: bash
      env:
        IMAGE_ORG: ${{ inputs.org_name }}
        IMAGE_NAME: ${{ inputs.final_image_name }}
        IMAGE_TAG: ${{ hashFiles('docker/Dockerfile') }}-${{ inputs.base_image_name }}
      run: |
        docker manifest inspect "ghcr.io/${IMAGE_ORG}/${IMAGE_NAME}:${IMAGE_TAG}" > /dev/null
        echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
